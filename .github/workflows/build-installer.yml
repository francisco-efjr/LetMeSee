name: Verify and build LetMeSee for Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows tests, GUI and portable package
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test runtime trust boundaries on Windows PowerShell 5.1
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\dependency_security.tests.ps1
          if (-not $?) { throw 'Dependency security tests failed.' }

      - name: Test application core
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\run-core-tests.ps1
          if (-not $?) { throw 'Core tests failed.' }

      - name: Test preparation matrix and Android package boundaries
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\run-preparation-tests.ps1
          if (-not $?) { throw 'Preparation tests failed.' }
          & .\tests\android-package.tests.ps1
          if (-not $?) { throw 'Android package tests failed.' }
          & .\tests\windows-package.tests.ps1
          if (-not $?) { throw 'Windows package tests failed.' }

      - name: Check design token contrast and preview JavaScript syntax
        run: |
          $ErrorActionPreference = 'Stop'
          node --check docs/design/workflow.js
          if ($LASTEXITCODE -ne 0) { throw 'Preview workflow syntax failed.' }
          node --test tests/preview-workflow.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Preview workflow tests failed.' }
          python tests/check-design.py
          if ($LASTEXITCODE -ne 0) { throw 'Design checks failed.' }
          $preview = [IO.File]::ReadAllText((Join-Path $PWD 'docs\design\preview.html'))
          $scripts = [regex]::Matches($preview, '(?is)<script(?:\s[^>]*)?>(.*?)</script>')
          if ($scripts.Count -eq 0) { throw 'Preview JavaScript was not found.' }
          $index = 0
          foreach ($script in $scripts) {
            $path = Join-Path $env:RUNNER_TEMP ('letmesee-preview-' + $index + '.js')
            [IO.File]::WriteAllText($path, $script.Groups[1].Value, (New-Object Text.UTF8Encoding($false)))
            node --check $path
            if ($LASTEXITCODE -ne 0) { throw 'Preview JavaScript syntax check failed.' }
            $index++
          }

      - name: Compile C# GUI
        shell: cmd
        run: call build_ui.bat

      - name: Package application without third-party runtimes
        run: .\scripts\package_windows.ps1 -Version 1.2.0

      - name: Upload review artifacts and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LetMeSee-windows-x64-portable-${{ github.run_number }}
          path: |
            dist/LetMeSee-1.2.0-windows-x64-portable.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

      # Publishing remains a separate action after reviewing this commit's builds.
      # Native third-party runtimes are excluded pending their distribution inventory.
